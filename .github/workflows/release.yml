name: Release

# Publica una versión: git tag v1.2.3 && git push origin v1.2.3
# Compila el APK de release firmado con la clave de los secretos, calcula su SHA-256 y crea la
# Release en GitHub. La app la detecta (AppUpdater) y la instala por encima.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: NDK y CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Versión desde la etiqueta
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MA MI PA <<< "${VERSION%%-*}"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Clave de firma
        env:
          HP_KEYSTORE_BASE64: ${{ secrets.HP_KEYSTORE_BASE64 }}
        run: |
          test -n "$HP_KEYSTORE_BASE64" || { echo "Falta el secreto HP_KEYSTORE_BASE64"; exit 1; }
          # Tolerate CR/LF, spaces or a UTF-8 BOM pasted into the secret (Windows clipboards).
          printf '%s' "$HP_KEYSTORE_BASE64" | tr -d '\r\n \t\357\273\277' | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "${{ secrets.HP_KEYSTORE_PASSWORD }}" >/dev/null \
            || { echo "HP_KEYSTORE_BASE64 / HP_KEYSTORE_PASSWORD do not open the keystore"; exit 1; }

      - name: Compilar APK firmado
        env:
          HP_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HP_KEYSTORE_PASSWORD: ${{ secrets.HP_KEYSTORE_PASSWORD }}
          HP_KEY_ALIAS: ${{ secrets.HP_KEY_ALIAS }}
          HP_KEY_PASSWORD: ${{ secrets.HP_KEY_PASSWORD }}
          HP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          HP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          HP_REPORT_URL: ${{ vars.HP_REPORT_URL }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Preparar archivos
        run: |
          mkdir -p out
          # The file name says which processor the APK is built for (arm64-v8a only, tuned for
          # Snapdragon 8 Elite). / El nombre indica el procesador para el que está hecho el APK.
          APK="out/Exedra64-v${{ steps.ver.outputs.name }}-Snapdragon8Elite-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd out && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -3
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes = this version's CHANGELOG section (English + Spanish), plus the auto list of PRs.
          VER="${{ steps.ver.outputs.name }}"
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Exedra64 $VER" > notes.md
          # A tag with a suffix (v1.3.0-beta) is published as a pre-release.
          PRE=""; case "$VER" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/* $PRE \
            --title "Exedra64 $VER" \
            --notes-file notes.md \
            --generate-notes
